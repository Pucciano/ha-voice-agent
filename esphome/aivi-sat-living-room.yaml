# AIVI satellite: living room reference device (plan phase 0)
#
# Phase 5 firmware: on-device wake word starts the Home Assistant voice
# pipeline; the answer plays on the room speaker. Build and flash with
# `make sat-flash SAT=living-room`.

substitutions:
  name: aivi-sat-living-room
  friendly_name: AIVI Satellit Wohnzimmer
  satellite_id: living_room

packages:
  base: !include packages/aivi-base.yaml
  xvf3800: !include packages/aivi-xvf3800.yaml
  voice_input: !include packages/aivi-voice-input.yaml
  leds: !include packages/aivi-leds.yaml
  diagnostics: !include packages/aivi-diagnostics.yaml

# Credentials stay in this file: every satellite has its own API key, which
# also encrypts OTA uploads, and a substitution cannot select a secret.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret living_room_api_key
