# AIVI satellite: diagnostics package
#
# Microphone level per I2S channel, Wi-Fi signal and a restart button. The
# levels show whether audio arrives and how loud the room is while the wake
# word is tested. The wake word uses the channel set by wake_word_channel.
#
# Levels are dBFS over two seconds of the processed XVF3800 output: 0 is
# digital full scale (clipping), everything below is negative. "Pegel" is the
# RMS (average), "Spitzenpegel" the loudest sample. They are not room sound
# pressure, and the XVF3800 gain control lifts quiet rooms.

sensor:
  - platform: sound_level
    passive: false
    measurement_duration: 2s
    microphone:
      microphone: i2s_mics
      channels: 0
    rms:
      name: Pegel Kanal 0
      unit_of_measurement: dBFS
      device_class: ""
      entity_category: diagnostic
    peak:
      name: Spitzenpegel Kanal 0
      unit_of_measurement: dBFS
      device_class: ""
      entity_category: diagnostic
  - platform: sound_level
    passive: false
    measurement_duration: 2s
    microphone:
      microphone: i2s_mics
      channels: 1
    rms:
      name: Pegel Kanal 1
      unit_of_measurement: dBFS
      device_class: ""
      entity_category: diagnostic
    peak:
      name: Spitzenpegel Kanal 1
      unit_of_measurement: dBFS
      device_class: ""
      entity_category: diagnostic
  - platform: wifi_signal
    name: WLAN-Signal
    entity_category: diagnostic
    update_interval: 60s

button:
  - platform: restart
    name: Neustart
    entity_category: diagnostic
