# AIVI satellite: echo canceller package (issue #17)
#
# Tunes the XVF3800's echo canceller for audio through the jack
# (aivi-audio-output.yaml). Echo canceller is AEC below.
#
#   AEC-Verzögerung            AUDIO_MGR_SYS_DELAY: samples (16 kHz) the
#                              XVF3800 delays the reference, -64..256
#   AEC-Referenzverstärkung    AUDIO_MGR_REF_GAIN: gain of the reference
#                              Both are kept on the satellite and written at
#                              boot; until set, the XVF3800 keeps its own
#                              defaults.
#   Echounterdrückung          AEC_AECCONVERGED, read every 2 s
#   eingeschwungen
#   Selbsttest starten         about 45 s of noise and tones through the jack,
#   Selbsttest abbrechen       recorded by the XVF3800. Needs "Klinke" as the
#                              output; the room should be quiet.
#   Echodämpfung messen        about 25 s: the attenuation with the current
#                              settings only, nothing changes; for comparing
#                              settings
#   Lautsprecher-Anlauf messen a repeating sweep, from the moment Home
#                              Assistant is told to switch the room speaker
#                              until 8 s after its first echo: when it plays
#                              and when every band is at full level. Nothing
#                              changes; start it with the speaker stopped for
#                              more than 15 min to time a sleeping amplifier.
#   Selbsttest Status, Ergebnis, Frequenzbänder, Hinweise
#   Echo-Verzögerung, Nachhallzeit, Echodämpfung, Echo-Abstand zur Referenz,
#   Lautsprecher-Anlaufzeit
#
# The self test measures the echo delay, the echo path per band, the
# reverberation time and the echo attenuation (see
# esphome/components/aec_tuning/analysis.h), then sets AEC-Verzögerung and
# AEC-Referenzverstärkung. Levels it only recommends (Hinweise): they also
# change what the wake word and speech recognition hear.
#
# Events to Home Assistant, each with the satellite_id:
#   esphome.aivi_self_test   phase start, done (with all values) or error;
#                            the warm-up test sends start when its sweep
#                            starts, so its times count from the switch
#
# Requires aivi-audio-output.yaml (self_test_mixing_input, aivi_player,
# stop_local_audio), aivi-voice-input.yaml (assistant_paused, va),
# aivi-leds.yaml (self_test_running, recording_mode) and aivi-xvf3800.yaml.

external_components:
  - source:
      type: local
      path: components
    components: [aec_tuning]

esphome:
  includes:
    - packages/aivi-aec.h
  on_boot:
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: self_test_status
            state: Bereit

aec_tuning:
  id: aec
  respeaker_id: respeaker
  speaker: self_test_mixing_input
  microphone:
    microphone: i2s_mics
    channels: [0, 1]
  on_status:
    - lambda: id(self_test_status).publish_state(aivi_aec::status_text(status));
    - if:
        condition:
          lambda: return status == "running:warmup";
        then:
          # The automation "AIVI Klinkenausgang" switches the room speaker
          # now, while the sweep starts.
          - homeassistant.event:
              event: esphome.aivi_self_test
              data:
                satellite_id: ${satellite_id}
                phase: start
    - if:
        condition:
          lambda: return status == "done";
        then:
          - lambda: |-
              const auto &r = id(aec).results();
              id(self_test_summary).publish_state(aivi_aec::summary(r));
              id(self_test_bands).publish_state(aivi_aec::bands(r));
              id(self_test_hints).publish_state(aivi_aec::hints(r));
              if (r.warmup) {
                id(speaker_warmup_time).publish_state(r.warmup_ready_ms / 1000.0f);
              } else {
                id(echo_attenuation).publish_state(r.erle_db);
                // The attenuation test measures nothing else.
                if (!r.attenuation_only) {
                  id(echo_delay).publish_state(r.delay_ms);
                  id(reverberation_time).publish_state(r.rt60_ms);
                  id(echo_to_reference).publish_state(r.echo_to_ref_db);
                }
              }
          - component.update: aec_sys_delay
          - component.update: aec_ref_gain
    - if:
        condition:
          lambda: return status == "done" && id(aec).results().warmup;
        then:
          - homeassistant.event:
              event: esphome.aivi_self_test
              data:
                satellite_id: ${satellite_id}
                phase: done
                mode: warmup
                summary: !lambda return aivi_aec::summary(id(aec).results());
                bands: !lambda return aivi_aec::bands(id(aec).results());
                hints: !lambda return aivi_aec::hints(id(aec).results());
                ref_ms: !lambda return aivi_aec::num(id(aec).results().warmup_ref_ms);
                onset_ms: !lambda return aivi_aec::num(id(aec).results().warmup_onset_ms);
                ready_ms: !lambda return aivi_aec::num(id(aec).results().warmup_ready_ms);
                settled: !lambda 'return id(aec).results().warmup_settled ? "true" : "false";'
                band_ready_ms: !lambda return aivi_aec::warmup_band_ready(id(aec).results());
                band_level_dbfs: !lambda return aivi_aec::warmup_band_levels(id(aec).results());
                # Broadband level of every sweep relative to the final one;
                # sweep w is heard at ramp_first_ms + w * ramp_step_ms.
                ramp_db: !lambda return aivi_aec::warmup_ramp(id(aec).results());
                ramp_first_ms: !lambda return aivi_aec::num(id(aec).results().warmup_window_ms(0, aec_self_test::kBands));
                ramp_step_ms: !lambda return std::to_string(aec_self_test::kSweepMs);
                floor_dbfs: !lambda return aivi_aec::num(id(aec).results().floor_dbfs, 1);
                warnings: !lambda return std::to_string(id(aec).results().warnings);
    - if:
        condition:
          lambda: return status == "done" && !id(aec).results().warmup;
        then:
          - homeassistant.event:
              event: esphome.aivi_self_test
              data:
                satellite_id: ${satellite_id}
                phase: done
                mode: !lambda 'return id(aec).results().attenuation_only ? "attenuation" : "full";'
                summary: !lambda return aivi_aec::summary(id(aec).results());
                bands: !lambda return aivi_aec::bands(id(aec).results());
                hints: !lambda return aivi_aec::hints(id(aec).results());
                delay_ms: !lambda return aivi_aec::num(id(aec).results().delay_ms, 2);
                delay_spread_samples: !lambda return std::to_string(id(aec).results().delay_spread);
                switch_ms: !lambda return aivi_aec::num(id(aec).results().switch_ms);
                sys_delay_old: !lambda return std::to_string(id(aec).results().sys_delay_old);
                sys_delay_new: !lambda return std::to_string(id(aec).results().sys_delay_new);
                ref_gain_old: !lambda return aivi_aec::num(id(aec).results().ref_gain_old, 3);
                ref_gain_new: !lambda return aivi_aec::num(id(aec).results().ref_gain_new, 3);
                residual_ms: !lambda return aivi_aec::num(id(aec).results().residual_ms, 1);
                echo_to_ref_db: !lambda return aivi_aec::num(id(aec).results().echo_to_ref_db, 1);
                rt60_ms: !lambda return aivi_aec::num(id(aec).results().rt60_ms);
                tail_coverage_db: !lambda return aivi_aec::num(id(aec).results().tail_coverage_db, 1);
                erle_db: !lambda return aivi_aec::num(id(aec).results().erle_db, 1);
                erle_trend: !lambda return aivi_aec::erle_trend(id(aec).results());
                echo_wait_ms: !lambda return aivi_aec::num(id(aec).results().echo_wait_ms);
                erle_band_db: !lambda return aivi_aec::num(id(aec).results().erle_band_db, 1);
                converged: !lambda 'return id(aec).results().converged ? "true" : "false";'
                warnings: !lambda return std::to_string(id(aec).results().warnings);
    - if:
        condition:
          lambda: return status.rfind("error:", 0) == 0;
        then:
          - homeassistant.event:
              event: esphome.aivi_self_test
              data:
                satellite_id: ${satellite_id}
                phase: error
                error: !lambda return status.substr(6);
    - if:
        condition:
          lambda: return status == "done" || status.rfind("error:", 0) == 0;
        then:
          - lambda: |-
              id(assistant_paused) = false;
              id(self_test_running) = false;

number:
  - platform: template
    id: aec_sys_delay
    name: AEC-Verzögerung
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: Samples
    mode: box
    min_value: -64
    max_value: 256
    step: 1
    update_interval: 10s
    lambda: return id(aec).sys_delay();
    set_action:
      - lambda: id(aec).set_sys_delay(x);
      - component.update: aec_sys_delay
  - platform: template
    id: aec_ref_gain
    name: AEC-Referenzverstärkung
    icon: mdi:tune-vertical
    entity_category: config
    mode: box
    min_value: 0.1
    max_value: 8
    step: 0.01
    update_interval: 10s
    lambda: return id(aec).ref_gain();
    set_action:
      - lambda: id(aec).set_ref_gain(x);
      - component.update: aec_ref_gain

binary_sensor:
  - platform: template
    name: Echounterdrückung eingeschwungen
    icon: mdi:waveform
    entity_category: diagnostic
    lambda: |-
      const int converged = id(aec).converged();
      if (converged < 0)
        return {};
      return converged == 1;

script:
  # Checks the conditions, then starts a test: "full" (the self test),
  # "attenuation" or "warmup".
  - id: self_test_start
    mode: single
    parameters:
      test: string
    then:
      - if:
          condition:
            lambda: |-
              const char *reason = nullptr;
              if (id(aec).self_test_running())
                reason = "läuft bereits";
              else if (!id(audio_on_jack))
                reason = "Audioausgabe auf Klinke stellen";
              else if (id(mic_mute_switch).state)
                reason = "Mikrofon ist stumm";
              else if (id(va).is_running())
                reason = "Assistent arbeitet gerade";
              else if (id(recording_mode) != 0)
                reason = "Wake-Word-Aufnahme läuft";
              else if (!id(api_id).is_connected())
                reason = "Home Assistant nicht verbunden";
              if (reason != nullptr)
                id(self_test_status).publish_state(std::string("Nicht gestartet: ") + reason);
              return reason == nullptr;
          then:
            - lambda: |-
                id(assistant_paused) = true;
                id(self_test_running) = true;
            - script.execute: stop_local_audio
            - media_player.stop: aivi_player
            # The automation "AIVI Klinkenausgang" switches the room speaker
            # to its analog input; the test then waits for the echo of its
            # pilot tone. The warm-up test sends the event itself, when its
            # sweep starts.
            - if:
                condition:
                  lambda: return test != "warmup";
                then:
                  - text_sensor.template.publish:
                      id: self_test_status
                      state: "Läuft: Lautsprecher auf Analogeingang"
                  - homeassistant.event:
                      event: esphome.aivi_self_test
                      data:
                        satellite_id: ${satellite_id}
                        phase: start
                  - delay: 2s
            - if:
                condition:
                  lambda: return !id(aec).start_self_test(aivi_aec::test_mode(test));
                then:
                  - lambda: |-
                      id(assistant_paused) = false;
                      id(self_test_running) = false;

button:
  - platform: template
    name: Selbsttest starten
    icon: mdi:sine-wave
    entity_category: config
    on_press:
      - script.execute:
          id: self_test_start
          test: full
  - platform: template
    name: Echodämpfung messen
    icon: mdi:volume-minus
    entity_category: config
    on_press:
      - script.execute:
          id: self_test_start
          test: attenuation
  - platform: template
    name: Lautsprecher-Anlauf messen
    icon: mdi:speaker-play
    entity_category: config
    on_press:
      - script.execute:
          id: self_test_start
          test: warmup
  - platform: template
    name: Selbsttest abbrechen
    icon: mdi:stop
    entity_category: config
    on_press:
      - lambda: |-
          if (id(aec).self_test_running()) {
            id(aec).abort_self_test();
          } else if (id(self_test_start).is_running()) {
            id(self_test_start).stop();
            id(assistant_paused) = false;
            id(self_test_running) = false;
            id(self_test_status).publish_state("Abgebrochen");
          }

text_sensor:
  - platform: template
    id: self_test_status
    name: Selbsttest Status
    icon: mdi:sine-wave
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: self_test_summary
    name: Selbsttest Ergebnis
    icon: mdi:clipboard-text-outline
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: self_test_bands
    name: Selbsttest Frequenzbänder
    icon: mdi:equalizer
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: self_test_hints
    name: Selbsttest Hinweise
    icon: mdi:lightbulb-outline
    entity_category: diagnostic
    update_interval: never

sensor:
  - platform: template
    id: echo_delay
    name: Echo-Verzögerung
    icon: mdi:timer-sand
    unit_of_measurement: ms
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: reverberation_time
    name: Nachhallzeit
    icon: mdi:waves
    unit_of_measurement: ms
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: echo_attenuation
    name: Echodämpfung
    icon: mdi:volume-minus
    unit_of_measurement: dB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: speaker_warmup_time
    name: Lautsprecher-Anlaufzeit
    icon: mdi:speaker-play
    unit_of_measurement: s
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: echo_to_reference
    name: Echo-Abstand zur Referenz
    icon: mdi:compare-vertical
    unit_of_measurement: dB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
