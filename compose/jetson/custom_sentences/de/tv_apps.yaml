---
# TV app sentences for speech-to-phrase 1.4.3, so the local pipeline can
# transcribe them. The sentence triggers of the Home Assistant automation
# "Fernseher App per Sprache" (config/homeassistant/tv_power/automation.yaml)
# handle them; keep both lists in step. "Disney+" is written out as "Disney
# Plus", because a "+" has no pronunciation.
language: "de"
intents:
  AiviTvApps:
    data:
      - sentences:
          - "(starte|start|öffne) [bitte] [mir] (Netflix|YouTube|Disney Plus|Disney|Prime Video|Amazon Prime [Video]|Amazon Video|Prime) [auf dem Fernseher]"
          - "(Netflix|YouTube|Disney Plus|Disney|Prime Video|Amazon Prime [Video]|Amazon Video|Prime) (starten|öffnen)"
          - "(schalte|schalt|mach) (Netflix|YouTube|Disney Plus|Disney|Prime Video|Amazon Prime [Video]|Amazon Video|Prime) (an|ein)"
