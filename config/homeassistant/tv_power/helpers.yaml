# Helpers of the TV power control, in the shape of configuration.yaml. In
# Home Assistant they are UI helpers (Settings -> Devices & services ->
# Helpers); keep this copy and Home Assistant in sync. See docs/tv_power.md.
#
# Each one is created with its key as the name, so the entity ids are
# English, and renamed afterwards. Only switch.tv_power ("Fernsehen") is
# exposed to Assist.

input_boolean:
  # Off by default: the weekly update window is optional.
  tv_update_window_enabled:
    name: Fernseher Updatefenster
    icon: mdi:update

schedule:
  tv_update_window:
    name: Fernseher Updatefenster Zeit
    icon: mdi:calendar-clock
    sunday:
      - from: "03:00:00"
        to: "05:00:00"

# Template helper (config flow "Template" -> "Switch"). On while the TV
# starts or shows a picture; off while it shuts down or has no power.
template:
  - switch:
      - name: Fernsehen
        unique_id: tv_power
        icon: mdi:television
        state: >-
          {{ is_state('script.tv_power_on', 'on')
             or (is_state('switch.living_room_lowboard_tv_plug', 'on')
                 and is_state('media_player.sony_xr_65x90k_2', 'on')
                 and not is_state('script.tv_power_off', 'on')) }}
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.tv_power_on
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.tv_power_off
