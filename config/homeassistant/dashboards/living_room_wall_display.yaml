  # chart, `side` the consumers; they sit side by side on a wide landscape
  # screen.
  - title: Strom
    path: strom
    subview: true
    icon: mdi:lightning-bolt-outline
    type: panel
    theme: scandi_beige
    cards:
      - type: custom:button-card
        template: wd_root
        custom_fields:
          main:
