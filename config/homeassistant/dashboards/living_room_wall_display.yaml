# Living room wall display ("Bedienfeld"), Shelly Wall Display X2i in portrait.
# Storage-mode dashboard `dashboard-living-room-wall-display`, built from this
# file and the shared templates in wall_display_templates.yaml by
# scripts/wall_display_deploy.py. Setup and prerequisites:
# docs/wall_display.md.
#
# Layout: one panel view with the root card `wd_root`; every section is a
# nested card. This file holds only entity ids, labels and room settings.

kiosk_mode:
  user_settings:
    # kiosk-mode matches the display name of the HA user, not the username.
    - users:
        - Shelly Wall Display
      hide_header: true
      hide_sidebar: true

title: Wanddisplay

button_card_templates:
  # Room settings for the shared templates.
  wd_room:
    variables:
      home_area: living_room

views:
  - title: Wohnzimmer
    path: home
    icon: mdi:home
    type: panel
    theme: scandi_beige
    cards:
      - type: custom:button-card
        template: wd_root
        custom_fields:
          main:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: wd_header
                - type: custom:button-card
                  template: wd_weather
                - type: custom:button-card
                  template: wd_section
                  variables:
                    icon: mdi:lightbulb-outline
                    title: Licht · Wohnzimmer
                  custom_fields:
                    aside:
                      card:
                        type: custom:button-card
                        template: wd_all_off
                    body:
                      card:
                        type: grid
                        columns: 3
                        square: false
                        cards:
                          - type: custom:button-card
                            template: wd_light_tile
                            entity: light.living_room_highboard_glass_cabinet
                            name: Vitrine
                            icon: mdi:vanity-light
                          - type: custom:button-card
                            template: wd_light_tile
                            entity: light.living_room_diner_table_pendant_lamp
                            name: Pendel
                            icon: mdi:ceiling-light-multiple
                          - type: custom:button-card
                            template: wd_light_tile
                            entity: light.living_room_floor_lamp_bulb_1
                            name: Stehlampe
                            icon: mdi:floor-lamp
                - type: custom:button-card
                  template: wd_section
                  variables:
                    icon: mdi:television
                    title: Fernsehen
                  custom_fields:
                    body:
                      card:
                        type: custom:button-card
                        template: wd_tv_tile
                        entity: switch.tv_power
                        name: Fernseher
                        icon: mdi:television
                        variables:
                          plug: switch.living_room_lowboard_tv_plug
                          power: sensor.living_room_lowboard_tv_plug_power
                          player: media_player.sony_xr_65x90k_2
                          on_script: script.tv_power_on
                          off_script: script.tv_power_off
                        triggers_update:
                          - switch.living_room_lowboard_tv_plug
                          - sensor.living_room_lowboard_tv_plug_power
                          - media_player.sony_xr_65x90k_2
                          - script.tv_power_on
                          - script.tv_power_off
          side:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: wd_section
                  variables:
                    icon: mdi:music-note
                    title: Musik
                  custom_fields:
                    aside:
                      card:
                        type: custom:button-card
                        template: wd_music_where
                    body:
                      card:
                        type: custom:button-card
                        template: wd_music
                - type: custom:button-card
                  template: wd_section
                  variables:
                    icon: mdi:thermometer
                    title: Raumklima
                  custom_fields:
                    aside:
                      card:
                        type: custom:button-card
                        template: wd_window_pill
                    body:
                      card:
                        type: custom:button-card
                        template: wd_climate_card
                - type: conditional
                  conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity: input_boolean.washer_running
                          state: 'on'
                        - condition: state
                          entity: input_boolean.dryer_running
                          state: 'on'
                        - condition: numeric_state
                          entity: sensor.laundry_washing_machine_plug_power
                          above: 5
                        - condition: numeric_state
                          entity: sensor.laundry_dryer_plug_power
                          above: 5
                  card:
                    type: custom:button-card
                    template: wd_section
                    variables:
                      icon: mdi:washing-machine
                      title: Geräte
                    custom_fields:
                      aside:
                        card:
                          type: custom:button-card
                          template: wd_devices_pill
                      body:
                        card:
                          type: grid
                          columns: 2
                          square: false
                          cards:
                            - type: custom:button-card
                              template: wd_appliance_tile
                              entity: sensor.laundry_washing_machine_plug_power
                              name: Waschmaschine
                              icon: mdi:washing-machine
                            - type: custom:button-card
                              template: wd_appliance_tile
                              entity: sensor.laundry_dryer_plug_power
                              name: Trockner
                              icon: mdi:tumble-dryer
