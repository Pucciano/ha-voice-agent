# Home Assistant scene: start WLED's Sunrise effect on the bed light
# (issue #24). It is deployed through the scene config API; keep this copy
# and Home Assistant in sync.
#
# The effect fills the strip from its middle with the Fire palette: black,
# dark red, orange, yellow, white. Its speed is the duration in minutes
# (1-60), so the scene alone runs as long as the last sunrise.
# script.bedroom_sunrise (script.yaml) sets the speed before it activates
# the scene. Brightness stays at 255 throughout: the palette makes the
# light dark at the start, not the brightness.
#
# The palette has no white channel: WLED takes each pixel's white from the
# segment's primary colour. The usual white of the bed light ([0, 0, 0, 255])
# would light the whole strip from the start, so the primary colour has no
# white. Its red is not shown; WLED's auto white ("Dual") adds white from
# the pale yellow and white end of the palette.
#
# The ceiling light is left as it is.
id: bedroom_sunrise
name: Schlafzimmer Sunrise
icon: mdi:weather-sunset-up
entities:
  light.bedroom_bed_wled:
    state: "on"
    brightness: 255
    effect: Sunrise
    rgbw_color: [255, 0, 0, 0]
